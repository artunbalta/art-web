<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Artun Balta</title>
<meta name="description" content="Artun Balta — electrical & electronics engineer working on neural signal processing and applied machine learning. MRes Neurotechnology at Imperial College London, co-founder of volina. The portfolio is a small pixel world you can walk around.">
<meta name="theme-color" content="#22467d">
<meta property="og:title" content="Artun Balta — a small pixel world">
<meta property="og:description" content="Neural signal processing, applied ML, volina. — and a dog called Paşa who will follow you around.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%2322467d'/%3E%3Crect x='3' y='9' width='10' height='4' fill='%23ecd6a4'/%3E%3Crect x='6' y='2' width='2' height='9' fill='%23b4784d'/%3E%3Crect x='7' y='2' width='5' height='4' fill='%23cfcedb'/%3E%3Crect x='11' y='3' width='1' height='3' fill='%23fff9ee'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Silkscreen&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game" role="img" aria-label="A small pixel-art world: Ankara, İstanbul and London, connected by a train. Use the CV button for a plain-text version."></canvas>

<!-- title -->
<section id="title" aria-label="Title screen">
  <div class="logo-wrap"><canvas id="logo" width="10" height="10" aria-hidden="true"></canvas><h1 class="sr">Artun Balta</h1></div>
  <p class="sub">engineer · decodes brains · co-founded a voice-AI company</p>
  <p class="press"><span class="k">press any key</span><span class="t">tap anywhere</span> to walk in</p>
  <div class="title-actions">
    <button class="btn" data-enter>Enter the world ▸</button>
    <button class="btn ghost" data-cv>Just the CV, please</button>
  </div>
  <p class="hint">Ankara → İstanbul → London. Some assembly required.</p>
</section>

<!-- HUD -->
<div id="zone" aria-live="polite"><i></i><span class="zn">Ankara · Home</span></div>
<nav id="hud" aria-label="Menu">
  <button class="secrets" data-journal title="Secrets found (opens the map)"><span>✦</span><b>0/0</b></button>
  <button data-map title="Map & fast travel (M)">MAP</button>
  <button data-cvbtn title="The plain CV">CV</button>
  <button class="snd" data-snd title="Sound on/off" aria-label="Toggle sound"><svg viewBox="0 0 9 8" width="18" height="16" shape-rendering="crispEdges" aria-hidden="true"><path d="M0 3h2V2h1V1h1V0h1v8H4V7H3V6H2V5H0z" fill="currentColor"/><path class="w" d="M6 2h1v1h1v2H7v1H6V5h1V3H6z" fill="currentColor"/></svg></button>
  <button data-help title="How to play">?</button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>

<!-- dialogue -->
<div id="dlg" role="dialog" aria-live="polite">
  <div class="name"></div>
  <div class="portrait"></div>
  <div class="text"></div>
  <div class="choices"></div>
  <div class="next" aria-hidden="true">▼</div>
</div>

<!-- info panel -->
<div id="panel" role="dialog" aria-modal="true">
  <article class="card" data-accent="teal">
    <header><span class="kicker"></span><button class="x" aria-label="Close">✕</button></header>
    <h2 class="title"></h2>
    <div class="body"></div>
    <footer><span class="esc">esc</span> to close</footer>
  </article>
</div>

<!-- map + journal -->
<div id="map" role="dialog" aria-modal="true" aria-label="Map">
  <div class="sheet">
    <header><span class="kicker">The map</span><button class="x" aria-label="Close">✕</button></header>
    <div class="mapwrap"><canvas></canvas><div class="labels"></div></div>
    <p class="mapnote">Tap a name to fast-travel. (The train is more fun.)</p>
    <div class="journal"><h3>Secrets <b>0/0</b></h3><ul></ul></div>
  </div>
</div>

<!-- recruiter mode -->
<div id="cv" role="dialog" aria-modal="true" aria-label="Curriculum vitae">
  <button class="x" aria-label="Back to the world">✕</button>
  <div class="doc"></div>
</div>

<div id="fade"></div>
<noscript><p style="font:16px sans-serif;color:#fff;padding:24px">This portfolio is a small game and needs JavaScript. The plain CV is here: <a style="color:#fadb74" href="assets/Artun_Balta_CV.pdf">Artun_Balta_CV.pdf</a></p></noscript>

<script src="js/core.js"></script>
<script src="js/terrain.js"></script>
<script src="js/art-buildings.js"></script>
<script src="js/art-props.js"></script>
<script src="js/chars.js"></script>
<script src="js/content.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/world.js"></script>
<script src="js/eggs.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
